# Single-chain model config: encodes k cluster chains WITHOUT binding partners,
# used for the k > 2 ablations described in Sec. 2.2.2 of the paper.
#
# NOTE: this is a TRAINING config and it does NOT describe the shipped
# checkpoints/single_chain_k{2,3,5}.ckpt, which predate it. Those store:
#
#     node_in_dim [26, 2]   edge_in_dim [17, 1]
#     num_layers 4          -> 4 encoder and 4 decoder layers
#     n_pooled_encoder_layers 0
#     features.representation 'ca'   (this config group uses 'ca_bb')
#     no pooling_strategy key at all
#
# Inference reads hyperparameters from the checkpoint, not from here, so the
# difference does not affect loading them. The values below are the intended
# current design and are deliberately NOT reverted to match the older
# checkpoints: this config trains new models, and matching it to the old ones
# would mean anyone retraining reproduces the older architecture.
#
# Because the checkpoints store no pooling_strategy, they load with the
# constructor default 'all_chains_equal' rather than 'single_chain_k'. That is
# worth knowing but is NOT a defect to "fix": measured over 16 benchmark
# targets they recover 33.9% (k=2), 37.1% (k=3) and 37.5% (k=5) against 41.9%
# for the multi-chain model and 5% for chance -- i.e. the moderate drop Table 3
# of the paper reports. Forcing pooling_strategy=single_chain_k instead raises
# inside the model, because the evaluation pipeline builds two-state pair
# graphs rather than k single chains. The default path is the working one.

_target_: dynamicmpnn.modules.models.models.DynamicMPNN

node_in_dim: [27, 2] # Input dimensions for node features (scalar channels, vector channels)

node_h_dim: [128, 16] # Hidden dimensions for node features (scalar channels, vector channels)

edge_in_dim: [18, 1] # (num_bb_atoms x num_rbf + num_bb_atoms, num_bb_atoms)
# Input dimensions for edge features (scalar channels, vector channels)

edge_h_dim: [32, 4] # Hidden dimensions for edge features (scalar channels, vector channels)

num_layers: 8 # Backwards compat fallback (used if encoder/decoder are not set)
num_encoder_layers: 8 # Encoder layers (global message passing)
num_decoder_layers: 4 # Decoder layers (local autoregressive message passing)

n_edge_gvps: 0

drop_rate: 0.5 # Dropout rate

out_dim: 20 # Output dimension (20 amino acids for Proteins)

n_samples: 16 # Number of samples to generate

temperature: 0.1 # Sampling temperature for evaluating recovery

# Single-chain mode: pool k conformations of the same chain
pooling_strategy: "single_chain_k"

n_pooled_encoder_layers: 4 # Post-pooling encoder layers for enriched representations

refresh_interval: 0 # Not used in single_chain_k mode
